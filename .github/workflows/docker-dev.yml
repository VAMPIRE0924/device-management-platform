name: Publish development Docker image

on:
  push:
    branches:
      - dev

permissions:
  contents: read

concurrency:
  group: docker-dev
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - id: build
        name: Build metadata
        run: |
          {
            echo "date=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "sha=$(git rev-parse HEAD)"
          } >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: mode=max
          sbom: true
          tags: vampirerune/device-management-platform:dev
          labels: |
            org.opencontainers.image.version=dev
            org.opencontainers.image.revision=${{ steps.build.outputs.sha }}
            org.opencontainers.image.created=${{ steps.build.outputs.date }}
            org.opencontainers.image.source=https://github.com/VAMPIRE0924/device-management-platform
          build-args: |
            VERSION=dev
            VCS_REF=${{ steps.build.outputs.sha }}
            BUILD_DATE=${{ steps.build.outputs.date }}
