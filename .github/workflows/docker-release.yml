name: Publish Docker image

on:
  workflow_dispatch:
    inputs:
      version:
        description: Release version, for example v1.0.1
        required: true

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.version }}
          fetch-depth: 0
      - name: Validate formal release source
        env:
          VERSION: ${{ inputs.version }}
        run: |
          printf '%s\n' "$VERSION" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$' || {
            echo "formal releases require a vX.Y.Z tag" >&2
            exit 1
          }
          git show-ref --verify --quiet "refs/tags/$VERSION" || {
            echo "formal releases require an existing Git tag" >&2
            exit 1
          }
          test "$(git rev-list -n 1 "refs/tags/$VERSION")" = "$(git rev-parse HEAD)" || {
            echo "the requested tag does not match the checked-out commit" >&2
            exit 1
          }
          git fetch --no-tags origin main
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)" || {
            echo "latest may only be published from the current main commit" >&2
            exit 1
          }
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - id: build
        name: Build metadata
        run: |
          echo "date=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: vampirerune/device-management-platform
          tags: |
            type=raw,value=${{ inputs.version }}
            type=raw,value=latest
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: mode=max
          sbom: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ inputs.version }}
            VCS_REF=${{ steps.build.outputs.sha }}
            BUILD_DATE=${{ steps.build.outputs.date }}
