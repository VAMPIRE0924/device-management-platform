name: Publish formal release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: docker-release
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - id: release
        name: Validate release metadata
        run: |
          version=$(tr -d '[:space:]' < VERSION)
          printf '%s\n' "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$' || {
            echo "VERSION must use X.Y.Z format" >&2
            exit 1
          }
          tag="v$version"
          frontend_version=$(node -p "require('./frontend/package.json').version")
          test "$frontend_version" = "$version" || {
            echo "frontend/package.json version must match VERSION" >&2
            exit 1
          }
          grep -Fq "## $tag " CHANGELOG.md || {
            echo "CHANGELOG.md must contain a $tag release section" >&2
            exit 1
          }

          git fetch --no-tags origin main
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)" || {
            echo "formal releases may only use the current main commit" >&2
            exit 1
          }
          git fetch --force --tags origin
          tag_exists=false
          release_required=true
          if git show-ref --verify --quiet "refs/tags/$tag"; then
            tag_exists=true
            tagged_commit=$(git rev-list -n 1 "refs/tags/$tag")
            if test "$tagged_commit" != "$(git rev-parse HEAD)"; then
              unexpected_changes=$(git diff --name-only "$tagged_commit"..HEAD | \
                grep -Ev '^(README\.md|\.github/workflows/docker-release\.yml)$' || true)
              test -z "$unexpected_changes" || {
                echo "$tag already points to a different commit; bump VERSION before merging non-documentation changes to main" >&2
                printf '%s\n' "$unexpected_changes" >&2
                exit 1
              }
              release_required=false
            fi
          fi

          {
            echo "version=$version"
            echo "tag=$tag"
            echo "tag_exists=$tag_exists"
            echo "release_required=$release_required"
          } >> "$GITHUB_OUTPUT"

      - if: steps.release.outputs.release_required == 'true'
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4
      - if: steps.release.outputs.release_required == 'true'
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Sync Docker Hub overview
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          auth_response=$(jq -n \
            --arg username "$DOCKERHUB_USERNAME" \
            --arg password "$DOCKERHUB_TOKEN" \
            '{username: $username, password: $password}' | \
            curl --fail --silent --show-error \
              --header 'Content-Type: application/json' \
              --data-binary @- \
              https://hub.docker.com/v2/users/login)
          hub_token=$(printf '%s' "$auth_response" | jq --exit-status --raw-output '.token')
          jq --raw-input --slurp '{full_description: .}' README.md | \
            curl --fail --silent --show-error \
              --request PATCH \
              --header "Authorization: JWT $hub_token" \
              --header 'Content-Type: application/json' \
              --data-binary @- \
              https://hub.docker.com/v2/repositories/vampirerune/device-management-platform/ \
              >/dev/null

      - id: build
        name: Build metadata
        if: steps.release.outputs.release_required == 'true'
        run: |
          {
            echo "date=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "sha=$(git rev-parse HEAD)"
          } >> "$GITHUB_OUTPUT"

      - id: meta
        if: steps.release.outputs.release_required == 'true'
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: vampirerune/device-management-platform
          tags: |
            type=raw,value=${{ steps.release.outputs.tag }}
            type=raw,value=main

      - name: Build and publish formal image
        if: steps.release.outputs.release_required == 'true'
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: mode=max
          sbom: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ steps.release.outputs.tag }}
            VCS_REF=${{ steps.build.outputs.sha }}
            BUILD_DATE=${{ steps.build.outputs.date }}

      - name: Create version tag
        if: steps.release.outputs.release_required == 'true' && steps.release.outputs.tag_exists == 'false'
        env:
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git tag -a "$TAG" -m "Release $TAG"
          git push origin "$TAG"

      - name: Create GitHub Release
        if: steps.release.outputs.release_required == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --verify-tag --title "$TAG" --generate-notes
          fi
